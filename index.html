<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sealed — private two-person chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

  <header class="brand">
    <div class="brand-left">
      <span class="brand-mark">✦</span>
      <span class="brand-name">Elomeno7</span>
    </div>
    <div class="theme-picker">
      <button id="btn-theme" class="theme-btn" aria-label="Theme badlo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3m0 14v3M4.93 4.93l2.12 2.12m9.9 9.9 2.12 2.12M2 12h3m14 0h3M4.93 19.07l2.12-2.12m9.9-9.9 2.12-2.12"/></svg></button>
      <div class="theme-menu" id="theme-menu">
        <button class="theme-option" data-theme="dark"><span class="theme-icon">☾</span>Dark mode</button>
        <button class="theme-option" data-theme="light"><span class="theme-icon">☼</span>Light mode</button>
      </div>
    </div>
  </header>

  <!-- HOME -->
  <section id="screen-home" class="screen active">
    <h1>Create your own private code.</h1>
    <p class="sub">Private chats, simple and personal. Share your code only with the person you want to connect with.</p>

    <div class="home-actions">
      <input id="input-name" class="code-input name-input" maxlength="30" placeholder="Apna naam likho" autocomplete="off">
      <input id="input-code" class="code-input" maxlength="22" placeholder="#love79" autocomplete="off" autocapitalize="none">
      <button id="btn-enter" class="btn btn-primary"><svg class="join-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M21 4v16"/></svg><span>Join Chat</span></button>
    </div>
    <p id="home-error" class="error-text"></p>
  </section>

  <!-- CONNECTING -->
  <section id="screen-connecting" class="screen">
    <div class="seal-card">
      <div class="spinner" aria-hidden="true"></div>
      <p class="seal-status" id="connecting-status">are joining…</p>
    </div>
  </section>

  <!-- CHAT -->
  <section id="screen-chat" class="screen chat-screen">
    <div class="chat-topbar">
      <div class="topbar-left">
        <span class="room-code" id="room-code-label">#code</span>
        <span class="peer-name-tag" id="peer-name-tag">Go to Chat</span>
      </div>
      <button id="btn-leave" class="btn btn-text danger small">leave</button>
    </div>
    <div class="lock-pill">
      <span class="lock-dot"></span>
      <span>End-to-end encrypted</span>
    </div>

    <div class="chat-messages" id="chat-messages"></div>
    <div id="reply-preview" class="reply-preview" hidden><div><strong id="reply-preview-title">Replying</strong><div id="reply-preview-text"></div></div><button type="button" id="reply-cancel" aria-label="Cancel reply">×</button></div>
    <form id="chat-form" class="chat-input-row">
      <input id="chat-input" class="chat-input" placeholder="Message likho…" autocomplete="off">
      <input id="file-input" type="file" accept="image/*" style="display: none;">
      <button type="button" id="btn-image" class="btn btn-outline small icon-btn" title="Image bhejo" aria-label="Image bhejo"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></button>
      <button type="submit" class="btn btn-primary small icon-btn" id="btn-send" aria-label="Send" title="Send"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
    </form>
  </section>

</div>

<div id="image-viewer" class="image-viewer" aria-hidden="true">
  <button type="button" id="image-viewer-close" class="viewer-close" aria-label="Close image">×</button>
  <img id="image-viewer-img" alt="Opened chat image">
  <button type="button" id="image-viewer-delete" class="viewer-delete" hidden><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m-11 0 1 15h12l1-15M10 10v7m4-7v7"/></svg> Delete image</button>
</div>

<script src="app.js"></script>
</body>
</html>
