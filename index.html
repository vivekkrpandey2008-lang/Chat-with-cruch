<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sealed — private two-person chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

  <header class="brand">
    <div class="brand-left">
      <span class="brand-mark">✦</span>
      <span class="brand-name">Elomeno7</span>
    </div>
    <div class="theme-picker">
      <button id="btn-theme" class="theme-btn" aria-label="Theme badlo">🎨</button>
      <div class="theme-menu" id="theme-menu">
        <button class="theme-option" data-theme="sealed"><span class="swatch swatch-sealed"></span>Sukoon</button>
        <button class="theme-option" data-theme="sunset"><span class="swatch swatch-sunset"></span>Sunahari Shaam</button>
        <button class="theme-option" data-theme="ocean"><span class="swatch swatch-ocean"></span>Neela Samandar</button>
        <button class="theme-option" data-theme="blossom"><span class="swatch swatch-blossom"></span>Love</button>
        <button class="theme-option" data-theme="midnight"><span class="swatch swatch-midnight"></span>Raat Rani</button>
      </div>
    </div>
  </header>

  <!-- HOME -->
  <section id="screen-home" class="screen active">
    <h1>Create your own private code.</h1>
    <p class="sub">Choose a code that only you and your love know.</p>

    <div class="home-actions">
      <input id="input-name" class="code-input name-input" maxlength="30" placeholder="Apna naam likho" autocomplete="off">
      <input id="input-code" class="code-input" maxlength="22" placeholder="#love79" autocomplete="off" autocapitalize="none">
      <button id="btn-enter" class="btn btn-primary"></button>
    </div>
    <p id="home-error" class="error-text"></p>
  </section>

  <!-- CONNECTING -->
  <section id="screen-connecting" class="screen">
    <div class="seal-card">
      <div class="spinner" aria-hidden="true"></div>
      <p class="seal-status" id="connecting-status">are joining…</p>
    </div>
  </section>

  <!-- CHAT -->
  <section id="screen-chat" class="screen chat-screen">
    <div class="chat-topbar">
      <div class="topbar-left">
        <span class="room-code" id="room -code-label">#code</span>
        <span class="peer-name-tag" id="peer-name-tag">Go to Chat</span>
      </div>
      <button id="btn-leave" class="btn btn-text danger small">leave</button>
    </div>
    <div class="lock-pill">
      <span class="lock-dot"></span>
      <span>End-to-end encrypted</span>
    </div>

    <div class="chat-messages" id="chat-messages"></div>
    <form id="chat-form" class="chat-input-row">
      <input id="chat-input" class="chat-input" placeholder="Message likho…" autocomplete="off">
      <input id="file-input" type="file" accept="image/*" style="display: none;">
      <button type="button" id="btn-image" class="btn btn-outline small" title="Image bhejo">🖼</button>
      <button type="submit" class="btn btn-primary small" id="btn-send">Bhejo</button>
    </form>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
