<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sealed — private two-person chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

  <header class="brand">
    <span class="brand-mark">✦</span>
    <span class="brand-name">Elomeno7</span>
  </header>

  <!-- HOME -->
  <section id="screen-home" class="screen active">
    <h1>CHAT WITH YOUR CRUSH</h1>
    <p class="sub"> ye chat end-to-end encrypted hai and  
    ⚠️ ispe abhi kaam chal raha hai</p>
    <div class="home-actions">
      <input id="input-code" class="code-input" maxlength="22" placeholder="#love79" autocomplete="off" autocapitalize="none">
      <button id="btn-enter" class="btn btn-primary">Chat mein jao</button>
    </div>
    <p id="home-error" class="error-text"></p>
  </section>

  <!-- CONNECTING -->
  <section id="screen-connecting" class="screen">
    <div class="seal-card">
      <div class="spinner" aria-hidden="true"></div>
      <p class="seal-status" id="connecting-status">Jud rahe hain…</p>
    </div>
  </section>

  <!-- CHAT -->
  <section id="screen-chat" class="screen chat-screen">
    <div class="chat-topbar">
      <div class="topbar-left">
        <span class="room-code" id="room-code-label">#code</span>
        <div class="lock-pill">
          <span class="lock-dot"></span>
          <span>End-to-end encrypted</span>
        </div>
      </div>
      <button id="btn-leave" class="btn btn-text danger small">Chhodo</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-live" data-tab="live">Chat</button>
      <button class="tab-btn" id="tab-history" data-tab="history">History</button>
    </div>

    <div class="tab-panel active" id="panel-live">
      <p class="peer-status" id="peer-status">Doosre insaan ke online aane ka wait ho raha hai…</p>
      <div class="chat-messages" id="chat-messages"></div>
      <form id="chat-form" class="chat-input-row">
        <input id="chat-input" class="chat-input" placeholder="Message likho…" autocomplete="off" disabled>
        <button type="submit" class="btn btn-primary small" id="btn-send" disabled>Bhejo</button>
      </form>
    </div>

    <div class="tab-panel" id="panel-history">
      <div class="history-list" id="history-list">
        <p class="empty-note">History load ho rahi hai…</p>
      </div>
    </div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
